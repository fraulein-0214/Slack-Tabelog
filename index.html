<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>ごはん検索</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111;
        }
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        height: 100dvh;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- 「This application was created by a Google Apps Script user」の帯は、GASの画面を直接開いたときだけ出る。
     このページの中に埋め込んで開くと出ない。 -->
    <iframe id="app" title="ごはん検索" allow="geolocation *"></iframe>
    <noscript>このページはJavaScriptが必要です。</noscript>
    <script>
      // ★ここだけ書き換える: GASのウェブアプリのURL(…/exec)
      var GAS_URL =
        "https://script.google.com/macros/s/AKfycbzC4Cch5CZVW4mh4lnSl5fO7OFHirqDGhljq_IfqOdrKXyz-1FXhaJswTVM0JSsJ2r8/exec";

      // このページのURLに付いた「?go=…」などは、そのままGASへ渡す(Slackのリンクを、このページに向けても動く)
      document.getElementById("app").src = GAS_URL + location.search;

      // 位置情報の橋渡し: 入れ子のGASの画面の中では、ブラウザが位置情報を止めることがある(特にスマホ)。
      // いちばん外のこのページで位置を取り、GASの画面へ渡す。許可を求められるのは、このページ(github.io)。
      window.addEventListener("message", function (ev) {
        var d = ev.data;
        // GASの画面(script.google.com / *.googleusercontent.com)からの依頼だけを受ける
        var ok = ev.origin === "https://script.google.com" || /^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/.test(ev.origin);
        if (!ok || !d || !ev.source) return;
        var say = function (m) {
          ev.source.postMessage(m, ev.origin);
        };
        if (d.type === "tabelog-geo-hello") {
          say({ type: "tabelog-geo-ack", id: d.id });
          return;
        }
        if (d.type === "tabelog-geo-perm") {
          // 位置情報が許可済みかだけを答える(許可の確認は出さない)
          var send = function (g) {
            say({ type: "tabelog-geo-perm-result", id: d.id, granted: g });
          };
          try {
            if (navigator.permissions && navigator.permissions.query) {
              navigator.permissions.query({ name: "geolocation" }).then(
                function (st) {
                  send(st.state === "granted");
                },
                function () {
                  send(false);
                }
              );
            } else send(false);
          } catch (e) {
            send(false);
          }
          return;
        }
        if (d.type !== "tabelog-geo") return;
        var reply = function (m) {
          m.type = "tabelog-geo-result";
          m.id = d.id;
          say(m);
        };
        if (!navigator.geolocation) return reply({ ok: false, code: 2 });
        navigator.geolocation.getCurrentPosition(
          function (p) {
            reply({ ok: true, lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy });
          },
          function (e) {
            reply({ ok: false, code: e.code });
          },
          {
            enableHighAccuracy: !!(d.o && d.o.enableHighAccuracy),
            timeout: (d.o && d.o.timeout) || 15000,
            maximumAge: (d.o && d.o.maximumAge) || 0,
          }
        );
      });
    </script>
  </body>
</html>
